[platformio]
default_envs = db-radar

; PlatformIO Project Configuration File
; ESP-IDF framework build (migrated from Arduino)

[env:db-radar]
; Pinned, not floating — this project targets ESP-IDF 5.5.0 specifically (framework-espidf ~3.50500.0
; under this platform version). Both build-time patch scripts (scripts/patch_i2c_master_nack_hang.py,
; scripts/patch_nimble_cpp_idf5.py) assume ESP-IDF 5.x source layout and are not verified against 6.x.
; An unpinned `platform = espressif32` floats to whatever is "latest" on a fresh install (CI or a
; user's first build), which silently landed on ESP-IDF 6.0.1 and broke the build outright — see
; docs/firmware_installation.md.
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
board_upload.flash_size = 16MB
board_build.partitions = partitions/partitions_ota.csv
board_build.filesystem = fatfs
; dio here is correct and NOT a contradiction with CONFIG_ESPTOOLPY_FLASHMODE_QIO=y in sdkconfig.
; This value (and the `dio` in flasher_args.json) only governs how the ROM bootloader performs its
; initial load; the 2nd-stage bootloader then upgrades the chip to QIO at runtime per the sdkconfig.
; The flash IS running QIO — the boot log says so. Verified 2026-07-28; do not "fix" this to qio.
board_build.flash_mode = dio
board_build.f_flash = 80000000L
upload_speed = 460800
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

extra_scripts =
    scripts/gen_version.py
    scripts/patch_i2c_master_nack_hang.py
    scripts/patch_nimble_cpp_idf5.py

build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -Wno-format
    -Wno-misleading-indentation
    -Iinclude/core
    -Iinclude/hardware/display
    -Iinclude/hardware/sensors
    -Iinclude/hardware/connectivity
    -Iinclude/hardware/i2c
    -Iinclude/hardware/input
    -Iinclude/ui
    -Iinclude/ui/fonts
    -Iinclude/utils
    -Iinclude/gpx
    -Iinclude/navigation

lib_deps =
    lvgl/lvgl@^8.3.11
    https://github.com/h2zero/esp-nimble-cpp.git#v1.4.1
